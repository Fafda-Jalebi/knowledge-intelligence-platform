[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kip"
version = "1.0.0"
description = "Knowledge Intelligence Platform - RAG backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "sqlalchemy==2.0.32",
    "alembic==1.13.1",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "qdrant-client==1.11.1",
    "pypdf==4.3.1",
    "python-docx==1.1.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "orjson==3.10.3",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==3.0.1"]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "mypy==1.11.2",
    "types-requests==2.32.0.20240822",
    "ruff==0.5.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "B", "C4", "T20"]
ignore = ["E501"]
exclude = [".venv", "venv", "__pycache__", ".mypy_cache", ".ruff_cache", "build", "dist", "*.egg-info"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [".venv", "venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["kip*"]
